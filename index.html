<body>
<div id="app"></div>

<script>
const DAY = 40; // gantt day width in px
const TYPES = ['epic', 'task', 'bug', 'improvement'], STATUS = ['todo', 'doing', 'done'], PRIO = ['low', 'med', 'high'];
const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = m => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const diff = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5); // days a -> b
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const short = s => new Date(s + 'T00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });

let items = load('items', []);       // {id, type, title, desc, epic, status, priority, start, due}
let sessions = load('sessions', []); // {start, min, item} - epic/type are looked up via the item
let st = load('pomodoro-state', null); // running timer {work, item, start, end}
let settings = { theme: 'system', work: 25, brk: 5, ...load('settings', {}) }; // minutes
let collapsed = new Set(load('collapsed', [])); // epics / parents hidden in List and Gantt
let q = ''; // list search text
let ask = null; // pending status change {id, to}, waits for confirmation
let gfilter = ''; // gantt: epic id, 'none', or '' for all
let gnew = null; // gantt: dates picked for a new task
let view = 'list', cur = null, filter = 'all', adding = false, isWork = true;

const byId = id => items.find(i => i.id === id);
const epicItem = id => { const e = byId(id); return e?.type === 'epic' ? e : null; };
const persist = () => { save('items', items); save('sessions', sessions); save('pomodoro-state', st); save('settings', settings); save('collapsed', [...collapsed]); };
const len = () => isWork ? settings.work : settings.brk;
// status change with an audit entry; the note is added later from the item's Activity list
function setStatus(it, to) {
  if (it.status === to) return;
  (it.log ??= []).push({ at: Date.now(), from: it.status, to, note: '' });
  it.status = to;
}
const askSheet = () => {
  const it = byId(ask.id);
  return `<div class="sheet"><button class="back" data-act="askno" aria-label="Cancel"></button><div class="panel"><h3>Change status?</h3>
    <div><span class="muted" style="display:inline">${esc(it.title)}</span></div>
    <div style="margin-top:10px"><span class="pill">${it.status}</span> → <span class="pill" style="background:var(--accent);color:#fff">${ask.to}</span></div>
    <input id="asknote" placeholder="Add a note (optional)" aria-label="Note">
    <div class="row"><button data-act="askno">Cancel</button><button class="primary" data-act="askok">Confirm</button></div></div></div>`;
};
function setField(it, f, v) {
  if (f === 'parent') { if (v) { it.parent = v; it.epic = byId(v).epic; } else delete it.parent; return; }
  it[f] = f === 'epic' ? v || null : v;
  if (f === 'type' && v === 'epic') it.epic = null;
  if (f === 'epic') subs(it.id).forEach(k => k.epic = it.epic);
  if (it.start && it.due && it.due < it.start) it[f === 'start' ? 'due' : 'start'] = v; // keep start <= due
}
const isoWeek = s => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const y = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - y) / 864e5 - 3 + (y.getDay() + 6) % 7) / 7); };
const range = (a, b) => a === b ? short(a) : `${short(a)} – ${short(b)}`;
const when = t => { const d = new Date(t); return (d.toDateString() === new Date().toDateString() ? 'Today' : d.toLocaleDateString([], { month: 'short', day: 'numeric' })) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
const blockedBy = it => items.filter(o => o.status !== 'done' && o.links?.some(l => l.t === 'blocks' && l.id === it.id));
const epicProgress = e => { const k = items.filter(i => i.epic === e.id && !i.parent && i.type !== 'epic'); return k.length ? [k.filter(x => x.status === 'done').length, k.length] : null; };
// doing first, done last; then earliest due (undated last), then high priority first
const RANK = { doing: 0, todo: 1, done: 2 }, PR = { high: 0, med: 1, low: 2 };
const byRank = (a, b) => RANK[a.status] - RANK[b.status] || (a.due || '9').localeCompare(b.due || '9') || PR[a.priority || 'med'] - PR[b.priority || 'med'];
const hasKids = it => items.some(i => i.parent === it.id || (it.type === 'epic' && i.epic === it.id));
const togBtn = it => hasKids(it) ? `<button class="tog ${collapsed.has(it.id) ? '' : 'open'}" data-act="tog" data-id="${it.id}" aria-label="${collapsed.has(it.id) ? 'Expand' : 'Collapse'}"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>` : '<span class="tog"></span>';
const subs = id => items.filter(i => i.parent === id);
const progress = it => { const k = subs(it.id); return k.length ? [k.filter(x => x.status === 'done').length, k.length] : null; };
const epicOf = it => it.type === 'epic' ? it.title : (epicItem(it.epic)?.title || 'No epic');

// [start, end] of an item; an epic without its own dates spans its children
function span(it) {
  let s = it.start || it.due, e = it.due || it.start;
  if (!s) {
    const k = items.filter(i => i.epic === it.id || i.parent === it.id).map(span).filter(Boolean);
    if (k.length) { s = k.map(x => x[0]).sort()[0]; e = k.map(x => x[1]).sort().pop(); }
  }
  return s ? [s, e] : null;
}

// minutes per key(item) since a timestamp; sessions of deleted items are ignored
function sum(since, key) {
  const o = {};
  for (const s of sessions) {
    const it = s.start >= since && byId(s.item);
    if (it) o[key(it)] = (o[key(it)] || 0) + s.min;
  }
  return o;
}
const minutesFor = it => sessions.filter(s => s.item === it.id || byId(s.item)?.parent === it.id || (it.type === 'epic' && byId(s.item)?.epic === it.id)).reduce((a, s) => a + s.min, 0);

function beep() {
  navigator.vibrate?.([300, 100, 300]);
  try { const c = new AudioContext(), o = c.createOscillator(); o.connect(c.destination); o.start(); o.stop(c.currentTime + 0.4); } catch {} // shortcut: iOS may block audio without a tap; vibration/UI still show the result
}

function finish() {
  if (st.work) sessions.push({ start: st.start, min: st.min ?? settings.work, item: st.item });
  isWork = !st.work; st = null; persist(); beep(); render();
}

function tick() {
  if (st && Date.now() >= st.end) return finish();
  const t = mmss(st ? Math.max(0, Math.ceil((st.end - Date.now()) / 1000)) : len() * 60);
  document.querySelectorAll('.ft').forEach(e => e.textContent = t);
  document.title = st ? t : 'Tasks';
}

const barsHtml = o => {
  const max = Math.max(1, ...Object.values(o));
  return Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div class="bar"><i style="width:${v / max * 100}%"></i><span><b>${esc(k)}</b><b>${fmt(v)}</b></span></div>`).join('') || '<div class="muted">Nothing yet</div>';
};
// view: [tab label, page title, icon path]
const VIEWS = {
  list: ['List', 'Tasks', '<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>'],
  board: ['Board', 'Board', '<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>'],
  gantt: ['Gantt', 'Timeline', '<path d="M3 6h10M7 12h13M5 18h8"/>'],
  stats: ['Time', 'Time', '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
};
const header = (extra = '') => `<div class="top"><h1>${VIEWS[view][1]}</h1>${extra}</div>`;
const tabbar = () => `<nav class="tabbar">${Object.entries(VIEWS).map(([v, [l, , icon]]) =>
  `<button data-act="tab" data-id="${v}" class="${view === v ? 'on' : ''}" aria-label="${l}"><svg viewBox="0 0 24 24">${icon}</svg>${l}</button>`).join('')}</nav>`;
const rowHtml = (it, sub) => {
  const late = it.due && it.status !== 'done' && it.due < today();
  const pr = progress(it), ep = it.type === 'epic' ? epicProgress(it) : null;
  const meta = [it.type, it.status, ep ? `${ep[0]}/${ep[1]} done` : '', pr ? `${pr[0]}/${pr[1]} subtasks` : '', it.status !== 'done' && blockedBy(it).length ? 'blocked' : '', it.priority && it.priority !== 'med' ? it.priority : '', it.due ? 'due ' + short(it.due) : '', minutesFor(it) ? fmt(minutesFor(it)) : ''].filter(Boolean).join(' · ');
  return `<div class="item ${sub === 1 ? 'sub' : sub === 2 ? 'sub sub2' : ''} ${it.type === 'epic' ? 'epicrow' : ''}" data-act="open" data-id="${it.id}">${view === 'list' ? togBtn(it) : ''}<span class="dot ${it.type}"></span><div class="txt">${esc(it.title)}<small class="${late ? 'late' : ''}">${meta}</small>${ep ? `<div class="prog" style="margin:6px 0 0"><i style="width:${ep[0] / ep[1] * 100}%"></i></div>` : ''}</div><span class="chev">›</span></div>`;
};
const group = rows => rows ? `<div class="group">${rows}</div>` : '';
// [overdue, due today] among items not done
const dueCounts = () => { const t = today(), o = items.filter(i => i.due && i.status !== 'done'); return [o.filter(i => i.due < t).length, o.filter(i => i.due === t).length]; };

// the part of the list that search redraws, so typing keeps focus
function listRows() {
  const epics = items.filter(i => i.type === 'epic'), t = today(), n = q.trim().toLowerCase();
  const hit = it => !n || `${it.title} ${it.desc || ''}`.toLowerCase().includes(n);
  const shown = it => hit(it) && (filter === 'today' ? it.due && it.due <= t && it.status !== 'done' : filter === 'open' ? it.status !== 'done' : filter === 'all' || it.status === filter);
  const shownSubs = p => subs(p.id).filter(shown).sort(byRank);
  const top = i => i.type !== 'epic' && !i.parent && (shown(i) || shownSubs(i).length);
  const open = id => n || !collapsed.has(id);
  const withSubs = (i, lvl) => rowHtml(i, lvl) + (open(i.id) ? shownSubs(i).map(k => rowHtml(k, 2)).join('') : '');
  const kids = e => items.filter(i => top(i) && i.epic === e.id).sort(byRank);
  const orphans = items.filter(i => top(i) && !epicItem(i.epic)).sort(byRank);
  const eps = epics.filter(e => !n || hit(e) || kids(e).length);
  return eps.map(e => group(rowHtml(e) + (open(e.id) ? kids(e).map(i => withSubs(i, 1)).join('') : ''))).join('') +
    (orphans.length ? `<h2>No epic</h2>${group(orphans.map(i => withSubs(i, 0)).join(''))}` : '') +
    (items.length ? (n && !eps.length && !orphans.length ? '<p class="muted">No matches.</p>' : '') : '<p class="muted">No items yet. Add an epic, then tasks, bugs and improvements under it.</p>');
}

function listHtml() {
  const epics = items.filter(i => i.type === 'epic'), [late, due] = dueCounts();
  const groups = items.filter(hasKids), allShut = groups.length && groups.every(g => collapsed.has(g.id));
  return header((groups.length ? `<button class="link" data-act="colall" style="margin-right:8px;padding:10px 8px;font-size:15px">${allShut ? 'Expand all' : 'Collapse all'}</button>` : '') + (adding ? '' : `<button class="add" data-act="add" aria-label="Add item">+</button>`)) +
    (late || due ? `<button class="today ${filter === 'today' ? 'on' : ''}" data-act="filter" data-id="${filter === 'today' ? 'all' : 'today'}">${[late && late + ' overdue', due && due + ' due today'].filter(Boolean).join(' · ')}</button>` : '') +
    (adding
      ? `<div class="card" style="padding:12px"><input id="nt" placeholder="Title" aria-label="Title">
         <div class="row"><select id="ntype" aria-label="Type">${TYPES.map(t => `<option value="${t}" ${t === 'task' ? 'selected' : ''}>${t}</option>`).join('')}</select>
         <select id="nepic" aria-label="Epic"><option value="">No epic</option>${epics.map(e => `<option value="${e.id}">${esc(e.title)}</option>`).join('')}</select></div>
         <div class="row"><label>Start<input id="ns" type="date"></label><label>Due<input id="nd" type="date"></label></div>
         <div class="row"><button data-act="add">Cancel</button><button class="primary" data-act="create">Add</button></div></div>`
      : '') +
    (items.length > 4 ? `<input id="q" type="search" placeholder="Search" aria-label="Search" value="${esc(q)}">` : '') +
    `<div class="seg">${['all', 'open', ...STATUS].map(f => `<button data-act="filter" data-id="${f}" class="${filter === f ? 'on' : ''}">${f}</button>`).join('')}</div>` +
    `<div id="res">${listRows()}</div>`;
}

function boardHtml() {
  return header() + `<div class="board">${STATUS.map((s, i) => { const col = items.filter(x => x.type !== 'epic' && x.status === s); return `<div class="col"><h2>${s} · ${col.length}</h2>${col.map(x =>
    `<div class="card item" data-act="open" data-id="${x.id}"><div class="txt"><div style="display:flex;align-items:center;gap:8px"><span class="dot ${x.type}"></span>${esc(x.title)}</div><small class="${x.due && x.due < today() && s !== 'done' ? 'late' : ''}">${x.parent ? '↳ ' + esc(byId(x.parent)?.title ?? '') : esc(epicOf(x))}${x.due ? ' · due ' + short(x.due) : ''}</small>
     <div class="row">${i ? `<button data-act="move" data-id="${x.id}" data-to="${STATUS[i - 1]}" aria-label="Move to ${STATUS[i - 1]}">‹ ${STATUS[i - 1]}</button>` : ''}${i < 2 ? `<button data-act="move" data-id="${x.id}" data-to="${STATUS[i + 1]}" aria-label="Move to ${STATUS[i + 1]}">${STATUS[i + 1]} ›</button>` : ''}</div></div></div>`).join('') || '<div class="muted" style="padding:0 4px">Empty</div>'}</div>`; }).join('')}</div>`;
}

function ganttHtml() {
  const t = today(), epics = items.filter(i => i.type === 'epic');
  const ws = i => [i, ...(collapsed.has(i.id) ? [] : subs(i.id))], plain = i => i.type !== 'epic' && !i.parent;
  const order = [...epics.filter(e => !gfilter || gfilter === e.id).flatMap(e => [e, ...(collapsed.has(e.id) ? [] : items.filter(i => plain(i) && i.epic === e.id).flatMap(ws))]), ...(!gfilter || gfilter === 'none' ? items.filter(i => plain(i) && !epicItem(i.epic)).flatMap(ws) : [])];
  const rows = order.map(it => [it, span(it)]);
  const dated = rows.filter(r => r[1]);
  const lo = addDays([t, ...dated.map(r => r[1][0])].sort()[0], -1), hi = addDays([t, ...dated.map(r => r[1][1])].sort().pop(), 6);
  const n = diff(lo, hi) + 1, x = diff(lo, t) * DAY;
  const head = Array.from({ length: n }, (_, i) => addDays(lo, i)), wd = d => new Date(d + 'T00:00').getDay();
  const names = dated.map(([it, [s, e]]) => `<div class="g-n ${it.type === 'epic' ? 'epicrow' : it.parent ? 'sub' : ''}" data-act="open" data-id="${it.id}">${togBtn(it)}<span class="dot ${it.type}"></span><div class="txt"><div>${esc(it.title)}</div><small data-lab="${it.id}">${range(s, e)}</small></div></div>`).join('');
  const bars = dated.map(([it, [s, e]]) => {
    const left = diff(lo, s) * DAY, w = (diff(s, e) + 1) * DAY;
    return `<div class="g-r"><div class="g-b ${it.type} ${it.status === 'done' ? 'done' : ''}" style="left:${left}px;width:${w}px" data-bar="${it.id}"><i class="h l"></i><i class="h r"></i>${w >= 3 * DAY ? `<span>${esc(it.title)}</span>` : ''}</div></div>`;
  }).join('');
  const none = rows.filter(r => !r[1]).map(r => rowHtml(r[0])).join('');
  const opt = (v, l, on) => `<option value="${v}" ${on ? 'selected' : ''}>${l}</option>`;
  const filt = epics.length ? `<select id="gfilter" aria-label="Filter by epic">${opt('', 'All epics', !gfilter)}${epics.map(e => opt(e.id, esc(e.title), gfilter === e.id)).join('')}${opt('none', 'No epic', gfilter === 'none')}</select>` : '';
  const form = gnew ? `<div class="card" style="padding:12px"><div class="lbl">New · ${range(gnew.s, gnew.e)}</div><input id="gt" placeholder="Title" aria-label="Title">
    <div class="row"><select id="gtype" aria-label="Type">${['task', 'bug', 'improvement'].map(t => `<option value="${t}">${t[0].toUpperCase() + t.slice(1)}</option>`).join('')}</select>
    <select id="gepic" aria-label="Epic"><option value="">No epic</option>${epics.map(e => opt(e.id, esc(e.title), e.id === gfilter)).join('')}</select></div>
    <div class="row"><button data-act="gcancel">Cancel</button><button class="primary" data-act="gcreate">Add</button></div></div>` : '';
  return header('<button class="link" data-act="today">Today</button><button class="add" data-act="gnew" aria-label="Add task" style="margin-left:12px">+</button>') + filt + form + (true
    ? `<div class="gwrap"><div class="gnames"><div class="g-hd"></div>${names}<div class="g-n g-add" data-act="gnew">+ New task</div></div>
      <div class="gantt" id="gantt" data-x="${x}" data-lo="${lo}"><div class="g-in" style="width:${n * DAY}px">
        ${head.map((d, i) => wd(d) % 6 ? '' : `<i class="g-we" style="left:${i * DAY}px"></i>`).join('')}
        <div class="g-hd"><div class="g-h m">${head.map((d, i) => `<div>${d.slice(8) === '01' || !i || wd(d) === 1 ? new Date(d + 'T00:00').toLocaleString([], { month: 'short' }) : ''}</div>`).join('')}</div>
        <div class="g-h">${head.map((d, i) => `<div>${wd(d) === 1 || !i ? 'W' + isoWeek(d) : ''}</div>`).join('')}</div>
        <div class="g-h d">${head.map(d => `<div class="${d === t ? 'on' : ''}">${new Date(d + 'T00:00').toLocaleDateString([], { weekday: 'narrow' })}<br><b>${+d.slice(8)}</b></div>`).join('')}</div></div>
        ${bars}<div class="g-r gnew" data-new="1"><span>Drag across days to add a task</span>${gnew ? `<div class="g-b ghost" style="left:${diff(lo, gnew.s) * DAY}px;width:${(diff(gnew.s, gnew.e) + 1) * DAY}px"></div>` : ''}</div><div class="g-t" style="left:${x + DAY / 2 - 1}px"></div></div></div></div>`
    : '') +
    (none ? `<h2>Unscheduled</h2>${group(none)}` : '');
}

function itemHtml() {
  const it = byId(cur);
  if (!it) { view = 'list'; return listHtml(); }
  const running = st && st.item === cur, busy = st && !running;
  const seg = (f, opts, v) => `<div class="lbl">${f}<div class="seg">${opts.map(o => `<button data-act="set" data-f="${f}" data-id="${o}" class="${o === v ? 'on' : ''}">${o === 'improvement' ? 'improve' : o}</button>`).join('')}</div></div>`;
  const log = (it.log || []).map((l, i) => [l, i]).reverse();
  const hist = sessions.filter(s => s.item === cur).slice(-10).reverse();
  const par = byId(it.parent), kids = subs(it.id), pr = progress(it);
  const opt = (v, l, on) => `<option value="${v}" ${on ? 'selected' : ''}>${l}</option>`;
  const REL = { blocks: ['Blocks', 'Blocked by'], relates: ['Relates to', 'Relates to'] };
  const lk = [...(it.links || []).filter(l => byId(l.id)).map(l => ({ label: REL[l.t][0], o: byId(l.id), from: it.id, to: l.id, t: l.t })),
    ...items.flatMap(o => (o.links || []).filter(l => l.id === it.id).map(l => ({ label: REL[l.t][1], o, from: o.id, to: it.id, t: l.t })))];
  const free = items.filter(o => o.type !== 'epic' && o.id !== it.id && !lk.some(x => x.o.id === o.id));
  const parents = items.filter(o => o.type !== 'epic' && !o.parent && o.id !== it.id);
  const types = TYPES.filter(t => t !== 'epic' || !(it.parent || kids.length));
  return `<button class="link" data-act="back">‹ ${par ? esc(par.title) : 'Tasks'}</button>
    <input data-f="title" value="${esc(it.title)}" aria-label="Title" style="font-size:24px;font-weight:700;margin-top:8px">
    <div class="lbl">Status<div class="seg">${STATUS.map(s => `<button data-act="status" data-id="${s}" class="${it.status === s ? 'on' : ''}">${s}</button>`).join('')}</div></div>
    <label>Type<select data-f="type">${types.map(t => opt(t, t[0].toUpperCase() + t.slice(1), t === it.type)).join('')}</select></label>
    ${it.type === 'epic' || kids.length ? '' : `<label>Parent task<select data-f="parent"><option value="">None</option>${parents.map(o => opt(o.id, esc(o.title), o.id === it.parent)).join('')}</select></label>`}
    ${seg('priority', PRIO, it.priority || 'med')}
    ${it.type === 'epic' || it.parent ? '' : `<label>Epic<select data-f="epic"><option value="">No epic</option>${items.filter(i => i.type === 'epic').map(e => `<option value="${e.id}" ${e.id === it.epic ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select></label>`}
    <div class="row"><label>Start<input type="date" data-f="start" value="${it.start || ''}"></label><label>Due<input type="date" data-f="due" value="${it.due || ''}"></label></div>
    <label>Description<textarea data-f="desc" rows="3">${esc(it.desc || '')}</textarea></label>
    ${it.type === 'epic' ? `<h2>Items</h2>${group(items.filter(i => i.epic === it.id).map(i => rowHtml(i)).join('')) || '<div class="muted">None yet</div>'}` : ''}
    ${it.type === 'epic' || it.parent ? '' : `<h2>Subtasks${pr ? ` · ${pr[0]}/${pr[1]}` : ''}</h2>${pr ? `<div class="prog"><i style="width:${pr[0] / pr[1] * 100}%"></i></div>` : ''}
      <div class="group">${kids.map(k => `<div class="item"><button class="chk ${k.status === 'done' ? 'on' : ''}" data-act="toggle" data-id="${k.id}" aria-label="Toggle done">${k.status === 'done' ? '✓' : ''}</button><div class="txt" data-act="open" data-id="${k.id}" style="${k.status === 'done' ? 'opacity:.5;text-decoration:line-through' : ''}">${esc(k.title)}${k.due ? `<small class="${k.status !== 'done' && k.due < today() ? 'late' : ''}">due ${short(k.due)}</small>` : ''}</div><div class="chev" data-act="open" data-id="${k.id}">›</div></div>`).join('')}
        <div class="subadd"><input id="nsub" placeholder="Add subtask…" aria-label="New subtask"><button class="primary" data-act="addsub" style="padding:10px 16px">Add</button></div></div>`}
    ${it.type === 'epic' || !(lk.length || free.length) ? '' : `<h2>Links</h2><div class="group">${lk.map(x => `<div class="item"><span class="pill">${x.label}</span><div class="txt" data-act="open" data-id="${x.o.id}" style="${x.o.status === 'done' ? 'opacity:.5;text-decoration:line-through' : ''}">${esc(x.o.title)}</div><button class="xbtn" data-act="unlink" data-from="${x.from}" data-to="${x.to}" data-t="${x.t}" aria-label="Remove link">✕</button></div>`).join('')}
      ${free.length ? `<div class="subadd"><select id="lt" aria-label="Relation"><option value="blocks">Blocks</option><option value="by">Blocked by</option><option value="relates">Relates to</option></select><select id="li" aria-label="Task">${free.map(o => opt(o.id, esc(o.title))).join('')}</select><button class="primary" data-act="addlink" style="padding:10px 16px">Add</button></div>` : ''}</div>`}
    <h2>Focus · total ${fmt(minutesFor(it))}</h2>
    <div class="card" style="padding:4px 16px 16px"><div class="big ${running ? 'ft' : ''}">${running ? '' : mmss(len() * 60)}</div>
    <div class="muted" style="text-align:center">${running ? (st.work ? 'Focus' : 'Break') : (isWork ? 'Focus' : 'Break')}</div>
    <div class="row" style="margin-top:12px"><button class="primary" data-act="${running ? 'stop' : 'start'}" ${busy ? 'disabled' : ''}>${running ? 'Stop' : busy ? 'Timer running on another item' : 'Start'}</button></div></div>
    ${log.length ? `<h2>Activity</h2>${group(log.map(([l, i]) => `<div class="item static"><div class="txt"><span class="pill">${l.from ? `${l.from} → ${l.to}` : `created · ${l.to}`}</span> <span class="muted" style="display:inline">${when(l.at)}</span>
      <input class="note" data-log="${i}" value="${esc(l.note || '')}" placeholder="Add note…" aria-label="Note"></div></div>`).join(''))}` : ''}
    ${hist.length ? `<h2>Sessions</h2>${group(hist.map(s => `<div class="item static"><div class="txt">${new Date(s.start).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div><span class="muted">${s.min}m</span></div>`).join(''))}` : ''}
    <button class="danger" data-act="del">Delete</button>`;
}

function statsHtml() {
  const day = new Date(); day.setHours(0, 0, 0, 0);
  const wk = new Date(day); wk.setDate(day.getDate() - ((day.getDay() + 6) % 7)); // Monday
  const tot = o => fmt(Object.values(o).reduce((a, b) => a + b, 0));
  const td = sum(+day, epicOf), w = sum(+wk, epicOf);
  const ago = settings.lastExport ? Math.floor((Date.now() - settings.lastExport) / 864e5) : null;
  const nudge = items.length && (ago === null || ago >= 7) ? `<div class="card" style="padding:12px 16px;color:var(--red)">${ago === null ? 'You have never exported a backup.' : `Last backup was ${ago} days ago.`} Your data only lives on this phone. Tap Export below.</div>` : '';
  return header() + nudge + `<h2>Today: ${tot(td)}</h2>${barsHtml(td)}
    <h2>This week: ${tot(w)} · by epic</h2>${barsHtml(w)}
    <h2>This week · by type</h2>${barsHtml(sum(+wk, it => it.type))}
    <h2>This week · top items</h2>${barsHtml(sum(+wk, it => it.title))}
    <h2>Settings</h2>${group(`<div class="item static"><div class="txt">Appearance</div><div class="seg" style="margin:0;flex:0 0 190px">${['system', 'light', 'dark'].map(t => `<button data-act="theme" data-id="${t}" class="${settings.theme === t ? 'on' : ''}">${t}</button>`).join('')}</div></div>` +
      [['work', 'Focus', 5], ['brk', 'Break', 1]].map(([k, l, d]) => `<div class="item static"><div class="txt">${l}</div><button class="step" data-act="step" data-f="${k}" data-id="${-d}" aria-label="Less ${l}">−</button><span class="num">${settings[k]} min</span><button class="step" data-act="step" data-f="${k}" data-id="${d}" aria-label="More ${l}">+</button></div>`).join(''))}
    <h2>Data</h2>
    <div class="row"><button data-act="export" style="background:var(--card)">Export</button><button data-act="import" style="background:var(--card)">Import</button></div>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <div class="muted" style="padding:0 4px">Export saves a .json file. Import replaces this device's data with a file.<br>Last backup: ${ago === null ? 'never' : ago === 0 ? 'today' : ago + ' days ago'}</div>`;
}

function exportData() {
  settings.lastExport = Date.now(); persist();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ items, sessions, settings }, null, 2)], { type: 'application/json' }));
  a.download = `tasks-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  render();
}

async function importFile(f) {
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.sessions)) throw 0;
    if (!confirm(`Replace this device's data with ${d.items.length} items and ${d.sessions.length} sessions?`)) return render();
    items = d.items; sessions = d.sessions;
    if (d.settings) settings = { ...settings, ...d.settings };
    if (st && !byId(st.item)) st = null;
    persist();
  } catch { alert('Not a valid export file'); }
  render();
}

function render() {
  document.documentElement.dataset.theme = settings.theme; // 'system' matches neither override, so the media query decides
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.content = getComputedStyle(document.body).backgroundColor);
  const foot = st && !(view === 'item' && cur === st.item)
    ? `<div class="foot" data-act="open" data-id="${st.item}">▶ ${esc(byId(st.item)?.title ?? '')} · <span class="ft"></span></div>` : '';
  document.body.className = 'v-' + view; // prefixed: .board, .gantt and .item are component classes
  const kept = $('gantt')?.scrollLeft; // a redraw after a drag must not jump the chart
  $('app').innerHTML = ({ list: listHtml, board: boardHtml, gantt: ganttHtml, stats: statsHtml, item: itemHtml })[view]() + foot + (view === 'item' ? '' : tabbar()) + (ask ? askSheet() : '');
  const g = $('gantt'); if (g) g.scrollLeft = kept ?? g.dataset.x - 60; // else start near today
  tick();
  if (gnew && $('gt') && !$('gt').dataset.seen) { $('gt').dataset.seen = 1; window.scrollTo(0, 0); $('gt').focus(); }
}

document.onclick = e => {
  const b = e.target.closest('button[data-act], div[data-act]'); if (!b) return;
  const { act, id } = b.dataset, it = byId(cur);
  if (act === 'tab') { view = id; cur = null; gnew = null; ask = null; }
  else if (act === 'export') return exportData();
  else if (act === 'import') return $('file').click(); // no render: it would drop the file input mid-dialog
  else if (act === 'today') return void ($('gantt').scrollLeft = $('gantt').dataset.x - 60);
  else if (act === 'filter') filter = id;
  else if (act === 'theme') settings.theme = id;
  else if (act === 'step') { const f = b.dataset.f; settings[f] = Math.min(120, Math.max(1, settings[f] + +id)); }
  else if (act === 'set') setField(it, b.dataset.f, id);
  else if (act === 'add') adding = !adding;
  else if (act === 'create') {
    const title = $('nt').value.trim(), type = $('ntype').value, start = $('ns').value;
    if (!title) return $('nt').focus();
    items.push({ id: crypto.randomUUID().slice(0, 8), type, title, desc: '', epic: type === 'epic' ? null : $('nepic').value || null, status: 'todo', priority: 'med', log: [{ at: Date.now(), from: null, to: 'todo', note: '' }], start, due: $('nd').value < start ? start : $('nd').value });
    adding = false;
  }
  else if (act === 'open') { view = 'item'; cur = id; }
  else if (act === 'back') { if (it?.parent) cur = it.parent; else { view = 'list'; cur = null; } }
  else if (act === 'tog') collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  else if (act === 'colall') { const g = items.filter(hasKids); g.every(x => collapsed.has(x.id)) ? collapsed.clear() : g.forEach(x => collapsed.add(x.id)); }
  else if (act === 'gnew') gnew = { s: today(), e: today() };
  else if (act === 'gcancel') gnew = null;
  else if (act === 'gcreate') {
    const title = $('gt').value.trim(); if (!title) return $('gt').focus();
    items.push({ id: crypto.randomUUID().slice(0, 8), type: $('gtype').value, title, desc: '', epic: $('gepic').value || null, status: 'todo', priority: 'med', log: [{ at: Date.now(), from: null, to: 'todo', note: '' }], start: gnew.s, due: gnew.e });
    gnew = null;
  }
  else if (act === 'addlink') {
    const t = $('lt').value, o = $('li').value; if (!o) return;
    const [a, l] = t === 'by' ? [byId(o), { t: 'blocks', id: it.id }] : [it, { t, id: o }];
    (a.links ??= []).push(l);
  }
  else if (act === 'unlink') { const a = byId(b.dataset.from); a.links = a.links.filter(l => !(l.id === b.dataset.to && l.t === b.dataset.t)); }
  else if (act === 'toggle') { const k = byId(id); ask = { id, to: k.status === 'done' ? 'todo' : 'done' }; }
  else if (act === 'addsub') {
    const title = $('nsub').value.trim(); if (!title) return $('nsub').focus();
    items.push({ id: crypto.randomUUID().slice(0, 8), type: 'task', title, desc: '', epic: it.epic, parent: it.id, status: 'todo', priority: 'med', log: [{ at: Date.now(), from: null, to: 'todo', note: '' }], start: '', due: '' });
    persist(); render(); return $('nsub').focus();
  }
  else if (act === 'status') ask = { id: cur, to: id };
  else if (act === 'move') ask = { id, to: b.dataset.to };
  else if (act === 'askno') ask = null;
  else if (act === 'askok') { const k = byId(ask.id), note = $('asknote').value.trim(); setStatus(k, ask.to); if (note) k.log.at(-1).note = note; ask = null; }
  else if (act === 'start' && !st) {
    st = { work: isWork, item: cur, start: Date.now(), end: Date.now() + len() * 60000, min: len() };
    if (isWork && it.status === 'todo') setStatus(it, 'doing');
  }
  else if (act === 'stop') st = null; // stopping early logs nothing
  else if (act === 'del' && confirm(`Delete "${it.title}"${subs(cur).length ? ` and its ${subs(cur).length} subtasks` : ''}?`)) {
    const gone = new Set([cur, ...subs(cur).map(k => k.id)]), p = it.parent;
    items = items.filter(i => !gone.has(i.id));
    items.forEach(i => { if (i.epic === cur) i.epic = null; if (i.links) i.links = i.links.filter(l => !gone.has(l.id)); });
    if (st && gone.has(st.item)) st = null;
    if (p) cur = p; else { view = 'list'; cur = null; }
  }
  if (ask && byId(ask.id)?.status === ask.to) ask = null; // tapping the current status asks nothing
  persist(); render();
};
document.oninput = e => { if (e.target.id === 'q') { q = e.target.value; $('res').innerHTML = listRows(); } };
const press = a => document.querySelector(`[data-act=${a}]:not(.back)`)?.click();
document.onkeydown = e => {
  const id = e.target.id, ENTER = { nsub: 'addsub', nt: 'create', gt: 'gcreate', asknote: 'askok' };
  if (e.key === 'Enter' && ENTER[id]) press(ENTER[id]);
  else if (e.key === 'Escape') ask ? press('askno') : gnew ? press('gcancel') : adding && press('add');
};
document.onchange = e => {
  const f = e.target.dataset.f, v = e.target.value;
  if (e.target.id === 'file') return importFile(e.target.files[0]);
  if (e.target.id === 'gfilter') { gfilter = v; return render(); }
  if (e.target.id === 'ntype') return void ($('nepic').hidden = v === 'epic');
  if (e.target.dataset.log) return void (byId(cur).log[e.target.dataset.log].note = v.trim(), persist()); // no render: keep the keyboard
  if (!f) return;
  const it = byId(cur);
  if (f === 'title' && !v.trim()) return render();
  setField(it, f, v);
  persist(); render();
};

// gantt: drag a bar to move it, drag an edge to change start/due, tap to open; snaps to whole days
let drag = null;
let mk = null; // drag on the empty bottom row to pick dates for a new task
document.onpointerdown = e => {
  const nr = e.target.closest('[data-new]');
  if (nr) {
    const x0 = nr.getBoundingClientRect().left, d = Math.max(0, Math.floor((e.clientX - x0) / DAY));
    mk = { nr, x0, lo: $('gantt').dataset.lo, a: d, b: d, ghost: Object.assign(document.createElement('div'), { className: 'g-b ghost' }) };
    nr.append(mk.ghost); nr.setPointerCapture(e.pointerId); return document.onpointermove(e);
  }
  const b = e.target.closest('[data-bar]'); if (!b) return;
  const it = byId(b.dataset.bar), [s, en] = span(it);
  drag = { it, b, x: e.clientX, s, e: en, mode: e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm', moved: 0 };
  b.setPointerCapture(e.pointerId);
};
document.onpointermove = e => {
  if (mk) {
    mk.b = Math.max(0, Math.floor((e.clientX - mk.x0) / DAY));
    const l = Math.min(mk.a, mk.b), r = Math.max(mk.a, mk.b);
    return void Object.assign(mk.ghost.style, { left: l * DAY + 'px', width: (r - l + 1) * DAY + 'px' });
  }
  if (!drag) return;
  drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.x));
  const d = Math.round((e.clientX - drag.x) / DAY);
  const s = drag.mode === 'r' ? drag.s : addDays(drag.s, d), en = drag.mode === 'l' ? drag.e : addDays(drag.e, d);
  if (s > en) return;
  drag.ns = s; drag.ne = en;
  const lo = $('gantt').dataset.lo, left = diff(lo, s) * DAY, w = (diff(s, en) + 1) * DAY, lab = document.querySelector(`[data-lab="${drag.it.id}"]`);
  Object.assign(drag.b.style, { left: left + 'px', width: w + 'px' });
  lab.textContent = range(s, en);
};
document.onpointerup = () => {
  if (mk) { const { lo, a, b } = mk; mk = null; gnew = { s: addDays(lo, Math.min(a, b)), e: addDays(lo, Math.max(a, b)) }; return render(); }
  if (!drag) return;
  const { it, ns, ne, moved } = drag; drag = null;
  if (moved < 5) { view = 'item'; cur = it.id; }
  else if (ns) { it.start = ns; it.due = ne; persist(); }
  render();
};

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js'); // offline: see sw.js
setInterval(tick, 500);
document.addEventListener('visibilitychange', tick);
render();

// self-check: ?test in the URL
if (location.search === '?test') {
  const keep = [items, sessions];
  items = [{ id: 'e', type: 'epic', title: 'E', epic: null }, { id: 't', type: 'bug', title: 'T', epic: 'e', start: '2026-01-02', due: '2026-01-05' }, { id: 'u', type: 'task', title: 'U', epic: 'e', due: '2026-01-09' }];
  sessions = [{ start: 1, min: 25, item: 't' }, { start: 1, min: 25, item: 'gone' }];
  console.assert(JSON.stringify(sum(0, epicOf)) === '{"E":25}', 'orphan ignored, bug counted under epic');
  console.assert(JSON.stringify(span(items[0])) === '["2026-01-02","2026-01-09"]', 'epic spans children');
  console.assert(diff('2026-01-30', '2026-02-02') === 3 && addDays('2026-01-31', 1) === '2026-02-01', 'dates');
  console.assert(minutesFor(items[0]) === 25 && fmt(65) === '1h 5m', 'epic total / fmt');
  console.assert(dueCounts().join() === '2,0', 'overdue / due today');
  items[1].status = 'done'; console.assert(dueCounts().join() === '1,0', 'done not overdue');
  console.assert(isoWeek('2026-01-01') === 1 && isoWeek('2026-10-18') === 42 && isoWeek('2024-12-30') === 1 && isoWeek('2027-01-01') === 53, 'iso week');
  setStatus(items[2], 'doing'); setStatus(items[2], 'doing');
  console.assert(items[2].log.length === 1 && items[2].log[0].to === 'doing' && items[2].status === 'doing', 'status change logged once');
  items.push({ id: 's', type: 'task', title: 'S', epic: 'e', parent: 'u', status: 'done', due: '2026-01-12' });
  sessions.push({ start: 1, min: 10, item: 's' });
  console.assert(progress(items[2]).join() === '1,1' && minutesFor(items[2]) === 10, 'subtask progress / minutes');
  items.push({ id: 'p', type: 'task', title: 'P', epic: 'e' }, { id: 'q', type: 'task', title: 'Q', epic: 'e', parent: 'p', due: '2026-01-12' });
  console.assert(span(items.at(-2)).join() === '2026-01-12,2026-01-12', 'undated parent spans its subtasks');
  items.find(i => i.id === 'q').links = [{ t: 'blocks', id: 'u' }];
  console.assert(blockedBy(items[2]).length === 1 && (items.find(i => i.id === 'q').status = 'done', blockedBy(items[2]).length === 0), 'blocked until the blocker is done');
  const pq = items.find(i => i.id === 'q'); setField(pq, 'parent', ''); console.assert(!pq.parent, 'parent cleared');
  const ord = [{ status: 'done', due: '2026-01-01' }, { status: 'todo', due: '2026-03-01', priority: 'low' }, { status: 'doing' }, { status: 'todo', due: '2026-02-01' }, { status: 'todo', due: '2026-03-01', priority: 'high' }].sort(byRank);
  console.assert(ord.map(o => o.status[0] + (o.due || '').slice(5, 7)).join() === 'd,t02,t03,t03,d01' && ord[2].priority === 'high', 'sort: doing, due, priority, done last');
  items.find(i => i.id === 'q').parent = 'p'; items.find(i => i.id === 't').status = 'done'; // q was unparented above
  console.assert(epicProgress(items[0]).join() === '1,3', 'epic progress counts top-level children only');
  [items, sessions] = keep; console.log('ok');
}
</script>
